<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocSplit — Assinar documento</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff; --soft: #f7f8fa; --line: #e6e8ee; --text: #0c0c0c;
      --muted: #727272; --lime: #b7ff33; --ink: #0c0c0c; --ok: #167447; --err: #b42318;
      --font: "Instrument Sans", Inter, ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--ink); color: var(--lime); display: grid; place-items: center; font-weight: 800; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    .muted { color: var(--muted); font-size: 14px; }
    .card { border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 16px; background: #fff; }
    .preview { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 12px; }
    .preview-bar { display: flex; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; background: var(--soft); }
    .preview-frame { display: flex; justify-content: center; padding: 16px; min-height: 200px; overflow: auto; max-height: 65vh; }
    .preview-wrap { position: relative; display: inline-block; }
    .stamp-marker { position: absolute; border: 2px dashed var(--lime); background: rgba(183,255,51,.15); border-radius: 6px; pointer-events: none; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 14px; font-family: inherit; margin-top: 10px; }
    label { font-size: 13px; color: var(--muted); display: block; margin-top: 10px; }
    .btn { margin-top: 16px; border: 0; background: var(--ink); color: #fff; font-weight: 700; border-radius: 999px; padding: 12px 20px; cursor: pointer; font-family: inherit; }
    .btn:disabled { background: #c5ced9; cursor: not-allowed; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); margin-top: 8px; margin-right: 8px; }
    .ok { color: var(--ok); font-weight: 700; }
    .err { color: var(--err); font-weight: 700; }
    .grid { display: grid; gap: 0; }
    .disclaimer { font-size: 12px; color: var(--muted); background: var(--soft); padding: 10px 12px; border-radius: 12px; margin-top: 12px; }
    .tabs { display: flex; gap: 8px; margin-top: 14px; }
    .tab { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
    .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .sig-wrap { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; background: #fafafa; overflow: hidden; }
    #sigPad { display: block; width: 100%; height: 160px; touch-action: none; cursor: crosshair; }
    .sig-actions { display: flex; flex-wrap: wrap; padding: 8px 10px 12px; gap: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">D</div>
      <div><strong>DocSplit</strong><br><small class="muted">Assinatura por link</small></div>
    </div>
    <div id="app">
      <p class="muted">Carregando solicitação…</p>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
  const API = window.BACKEND_URL || 'https://docsplit.fly.dev';
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  let meta = null;
  let previewPdf = null;
  let previewPage = 1;
  let stampPos = { x: 0.62, y: 0.78 };
  let sigMode = 'draw';
  let sigDrawing = false;
  let sigHasInk = false;
  let sigCtx = null;

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function detail(d) {
    if (!d) return 'Erro';
    if (typeof d.detail === 'string') return d.detail;
    if (Array.isArray(d.detail)) return d.detail.map(x => x.msg || x).join('; ');
    return 'Erro';
  }

  async function init() {
    const app = document.getElementById('app');
    if (!token) {
      app.innerHTML = '<p class="err">Link inválido. Solicite um novo link a quem enviou o documento.</p>';
      return;
    }
    try {
      const r = await fetch(API + '/api/signing/public/' + encodeURIComponent(token));
      const d = await r.json();
      if (!r.ok) throw new Error(detail(d));
      meta = d;
      stampPos.x = d.pos_x || 0.62;
      stampPos.y = d.pos_y || 0.78;
      if (d.already_signed || d.status === 'signed') {
        const progress = (d.signed_count || 0) + '/' + (d.total_signers || 1);
        app.innerHTML = '<h1>Você já assinou</h1><p class="muted">Progresso do documento: <b>' + esc(progress) + '</b> assinatura(s).</p>'
          + '<button class="btn" id="dl">Baixar PDF atual</button>';
        document.getElementById('dl').onclick = () => downloadSigned();
        return;
      }
      renderForm();
      await loadPdf();
      setupSignaturePad();
    } catch (e) {
      app.innerHTML = '<p class="err">' + esc(e.message) + '</p>';
    }
  }

  function renderForm() {
    const app = document.getElementById('app');
    const msg = meta.owner_message ? '<div class="card"><strong>Mensagem:</strong><br>' + esc(meta.owner_message) + '</div>' : '';
    const progress = (meta.signed_count || 0) + ' de ' + (meta.total_signers || 1);
    const order = meta.sign_order ? ' · Signatário ' + meta.sign_order : '';
    app.innerHTML = '<h1>Assinar documento</h1>'
      + '<p class="muted">Arquivo: <b>' + esc(meta.original_filename || 'documento.pdf') + '</b>'
      + (meta.recipient_name ? ' · Para: <b>' + esc(meta.recipient_name) + '</b>' : '') + order + '</p>'
      + '<p class="muted">Progresso: <b>' + esc(progress) + '</b> assinatura(s) concluída(s).</p>'
      + msg
      + '<div class="card grid">'
      + '<div class="preview"><div class="preview-bar"><span id="previewName">' + esc(meta.original_filename || 'documento.pdf') + '</span>'
      + '<span id="previewMeta">—</span></div><div class="preview-frame" id="previewFrame"></div></div>'
      + '<p class="muted" style="margin:12px 0 0">Clique no PDF para posicionar o carimbo/assinatura.</p>'
      + '<input id="stampName" placeholder="Seu nome completo *" value="' + esc(meta.recipient_name || '') + '">'
      + '<input id="stampRole" placeholder="Cargo / função (opcional)">'
      + '<input id="stampCompany" placeholder="Empresa (opcional)">'
      + '<input id="stampDoc" placeholder="CPF ou CNPJ (opcional)">'
      + '<input id="stampCustom" placeholder="Linha personalizada (opcional)">'
      + '<div class="tabs">'
      + '<button type="button" class="tab active" data-mode="draw" id="tabDraw">Desenhar assinatura</button>'
      + '<button type="button" class="tab" data-mode="upload" id="tabUpload">Enviar imagem</button>'
      + '</div>'
      + '<div id="drawPanel">'
      + '<div class="sig-wrap"><canvas id="sigPad" width="700" height="160"></canvas>'
      + '<div class="sig-actions"><button type="button" class="btn ghost" id="clearSig">Limpar</button></div></div>'
      + '<p class="muted" style="margin-top:8px">Assine com o mouse ou o dedo na área acima.</p>'
      + '</div>'
      + '<div id="uploadPanel" hidden>'
      + '<label>Imagem da assinatura<input id="stamp" type="file" accept=".png,.jpg,.jpeg,.webp"></label>'
      + '</div>'
      + '<p class="disclaimer">Carimbo visual para uso comercial simples. Não substitui assinatura digital ICP-Brasil.</p>'
      + '<button class="btn" id="signBtn">Assinar e concluir</button>'
      + '<div id="status" style="margin-top:12px"></div>'
      + '</div>';
    document.getElementById('signBtn').addEventListener('click', submitSign);
    document.getElementById('tabDraw').addEventListener('click', () => setSigMode('draw'));
    document.getElementById('tabUpload').addEventListener('click', () => setSigMode('upload'));
    document.getElementById('clearSig').addEventListener('click', clearSignaturePad);
  }

  function setSigMode(mode) {
    sigMode = mode;
    document.getElementById('tabDraw').classList.toggle('active', mode === 'draw');
    document.getElementById('tabUpload').classList.toggle('active', mode === 'upload');
    document.getElementById('drawPanel').hidden = mode !== 'draw';
    document.getElementById('uploadPanel').hidden = mode !== 'upload';
  }

  function setupSignaturePad() {
    const canvas = document.getElementById('sigPad');
    if (!canvas) return;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = canvas.clientWidth || 700;
    const cssH = 160;
    canvas.width = Math.floor(cssW * ratio);
    canvas.height = Math.floor(cssH * ratio);
    canvas.style.height = cssH + 'px';
    sigCtx = canvas.getContext('2d');
    sigCtx.scale(ratio, ratio);
    sigCtx.lineWidth = 2.2;
    sigCtx.lineCap = 'round';
    sigCtx.lineJoin = 'round';
    sigCtx.strokeStyle = '#111';
    sigCtx.fillStyle = '#fafafa';
    sigCtx.fillRect(0, 0, cssW, cssH);
    sigHasInk = false;

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const src = e.touches && e.touches[0] ? e.touches[0] : e;
      return { x: src.clientX - rect.left, y: src.clientY - rect.top };
    }
    function start(e) {
      e.preventDefault();
      sigDrawing = true;
      const p = pos(e);
      sigCtx.beginPath();
      sigCtx.moveTo(p.x, p.y);
    }
    function move(e) {
      if (!sigDrawing) return;
      e.preventDefault();
      const p = pos(e);
      sigCtx.lineTo(p.x, p.y);
      sigCtx.stroke();
      sigHasInk = true;
    }
    function end() { sigDrawing = false; }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  }

  function clearSignaturePad() {
    const canvas = document.getElementById('sigPad');
    if (!canvas || !sigCtx) return;
    const cssW = canvas.clientWidth || 700;
    const cssH = 160;
    sigCtx.save();
    sigCtx.setTransform(1, 0, 0, 1, 0, 0);
    sigCtx.clearRect(0, 0, canvas.width, canvas.height);
    sigCtx.restore();
    sigCtx.fillStyle = '#fafafa';
    sigCtx.fillRect(0, 0, cssW, cssH);
    sigCtx.strokeStyle = '#111';
    sigCtx.lineWidth = 2.2;
    sigHasInk = false;
  }

  function signaturePngBlob() {
    return new Promise((resolve) => {
      const canvas = document.getElementById('sigPad');
      if (!canvas || !sigHasInk) { resolve(null); return; }
      // Exporta com fundo transparente: redesenha ink sobre canvas limpo
      const out = document.createElement('canvas');
      out.width = canvas.width;
      out.height = canvas.height;
      const ctx = out.getContext('2d');
      ctx.drawImage(canvas, 0, 0);
      // Torna pixels quase brancos transparentes
      const img = ctx.getImageData(0, 0, out.width, out.height);
      const data = img.data;
      for (let i = 0; i < data.length; i += 4) {
        if (data[i] > 240 && data[i + 1] > 240 && data[i + 2] > 240) data[i + 3] = 0;
      }
      ctx.putImageData(img, 0, 0);
      out.toBlob((blob) => resolve(blob), 'image/png');
    });
  }

  async function loadPdf() {
    const frame = document.getElementById('previewFrame');
    frame.innerHTML = '<p class="muted">Carregando PDF…</p>';
    const r = await fetch(API + '/api/signing/public/' + encodeURIComponent(token) + '/pdf');
    if (!r.ok) { frame.innerHTML = '<p class="err">Não foi possível carregar o PDF.</p>'; return; }
    const buf = await r.arrayBuffer();
    previewPdf = await pdfjsLib.getDocument({ data: buf }).promise;
    previewPage = meta.page_number > 0 ? meta.page_number : previewPdf.numPages;
    await renderPage();
  }

  async function renderPage() {
    if (!previewPdf) return;
    const page = await previewPdf.getPage(previewPage);
    const frame = document.getElementById('previewFrame');
    const maxW = Math.min(frame.clientWidth || 700, 760);
    const vp1 = page.getViewport({ scale: 1 });
    const scale = Math.min(maxW / vp1.width, 1.5);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    frame.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'preview-wrap';
    wrap.appendChild(canvas);
    const marker = document.createElement('div');
    marker.className = 'stamp-marker';
    marker.id = 'stampMarker';
    wrap.appendChild(marker);
    positionMarker(marker, canvas);
    canvas.style.cursor = 'crosshair';
    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      stampPos.x = Math.max(0, Math.min(0.85, (e.clientX - rect.left) / rect.width));
      stampPos.y = Math.max(0, Math.min(0.85, (e.clientY - rect.top) / rect.height));
      positionMarker(marker, canvas);
    });
    frame.appendChild(wrap);
    document.getElementById('previewMeta').textContent = 'Página ' + previewPage + ' de ' + previewPdf.numPages;
  }

  function positionMarker(marker, canvas) {
    const w = Math.max(80, canvas.width * 0.28);
    const h = Math.max(36, canvas.height * 0.12);
    marker.style.width = w + 'px';
    marker.style.height = h + 'px';
    marker.style.left = Math.min(stampPos.x * canvas.width, canvas.width - w - 4) + 'px';
    marker.style.top = Math.min(stampPos.y * canvas.height, canvas.height - h - 4) + 'px';
  }

  async function submitSign() {
    const status = document.getElementById('status');
    const name = document.getElementById('stampName').value.trim();
    const stamp = document.getElementById('stamp');
    const hasImg = stamp && stamp.files && stamp.files[0];
    let drawnBlob = null;
    if (sigMode === 'draw') {
      drawnBlob = await signaturePngBlob();
    }
    if (!name && !hasImg && !drawnBlob) {
      status.innerHTML = '<span class="err">Informe seu nome e desenhe a assinatura (ou envie uma imagem).</span>';
      return;
    }
    if (sigMode === 'draw' && !drawnBlob && !name) {
      status.innerHTML = '<span class="err">Desenhe sua assinatura na área indicada.</span>';
      return;
    }
    const fd = new FormData();
    fd.append('label', name);
    fd.append('role', document.getElementById('stampRole').value);
    fd.append('company', document.getElementById('stampCompany').value);
    fd.append('document_id', document.getElementById('stampDoc').value);
    fd.append('custom_line', document.getElementById('stampCustom').value);
    fd.append('x_ratio', String(stampPos.x));
    fd.append('y_ratio', String(stampPos.y));
    if (drawnBlob) {
      fd.append('stamp', drawnBlob, 'assinatura_manuscrita.png');
    } else if (hasImg) {
      fd.append('stamp', stamp.files[0]);
    }
    status.innerHTML = 'Assinando…';
    document.getElementById('signBtn').disabled = true;
    try {
      const r = await fetch(API + '/api/signing/public/' + encodeURIComponent(token) + '/complete', { method: 'POST', body: fd });
      const d = await r.json();
      if (!r.ok) throw new Error(detail(d));
      const progress = (d.signed_count || 0) + '/' + (d.total_signers || 1);
      if (d.completed) {
        status.innerHTML = '<span class="ok">Todas as assinaturas concluídas (' + esc(progress) + ')!</span>';
      } else {
        status.innerHTML = '<span class="ok">Sua assinatura foi registrada (' + esc(progress) + '). Aguarde os demais signatários.</span>';
      }
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = 'Baixar PDF assinado';
      btn.onclick = () => downloadSigned();
      status.appendChild(btn);
    } catch (e) {
      status.innerHTML = '<span class="err">' + esc(e.message) + '</span>';
      document.getElementById('signBtn').disabled = false;
    }
  }

  function downloadSigned() {
    const a = document.createElement('a');
    a.href = API + '/api/signing/public/' + encodeURIComponent(token) + '/signed';
    a.download = 'documento_assinado.pdf';
    a.click();
  }

  init();
  </script>
</body>
</html>
